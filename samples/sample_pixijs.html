<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>LiquidFun-WASM PixiJS Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: black;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #stats {
        position: fixed;
        inset: 12px auto auto 96px;
        color: white;
        font:
          11px/1.3 ui-monospace,
          monospace;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.mjs",
          "liquidfun-wasm": "https://cdn.jsdelivr.net/npm/liquidfun-wasm@7.0.0/dist/es/entry.js"
        }
      }
    </script>
    <script src="https://mrdoob.github.io/stats.js/build/stats.min.js"></script>
    <script type="module">
      import {
        Application,
        Graphics,
        Particle,
        ParticleContainer,
        Texture,
      } from "pixi.js";
      import Box2DFactory from "liquidfun-wasm";

      // LiquidFunはメートル、PixiJSはピクセルで扱う。
      const METER = 100;
      const TIME_STEP = 1 / 60;
      const MAX_FRAME_DELTA = 0.25;
      const MAX_PHYSICS_STEPS = 5;
      const SIZE_PARTICLE = 4;
      const SIZE_DRAGGABLE = 50;
      // この領域で実行時の粒子数は約10,000個になる。
      const PARTICLE_HALF_WIDTH = 375;
      const PARTICLE_HALF_HEIGHT = 240;
      const STATS_UPDATE_INTERVAL = 6;
      const dpi = devicePixelRatio;
      const toMeters = (pixels) => pixels / METER;

      const Box2D = await Box2DFactory();
      const app = new Application();
      await app.init({
        resolution: dpi,
        autoDensity: true,
        autoStart: false,
        resizeTo: window,
        preference: "webgpu",
      });
      document.body.append(app.canvas);
      app.stage.eventMode = "static";

      // stats.jsはFPSグラフ、右側のテキストは処理時間の内訳を表示する。
      const frameStats = new globalThis.Stats();
      frameStats.showPanel(0);
      frameStats.dom.style.inset = "12px auto auto 12px";
      document.body.append(frameStats.dom);

      const world = new Box2D.b2World(new Box2D.b2Vec2(0, 10));
      // MouseJointの固定側は、リサイズで作り直す壁とは分けておく。
      const groundBody = world.CreateBody(new Box2D.b2BodyDef());
      let wallBodies = [];
      createWalls();

      const particleSystem = createParticles();
      const particleCount = particleSystem.GetParticleCount();
      // 粒子数は固定なので、WASMバッファの先頭位置も一度だけ求める。
      const positionOffset =
        Box2D.getPointer(particleSystem.GetPositionBuffer()) >> 2;
      const ballBody = createBall();
      const { ballView, particleViews } = createViews();
      const particleIterations =
        world.CalculateReasonableParticleIterations(TIME_STEP);

      const statsText = document.querySelector("#stats");
      const runtimeStats = {
        particleCount,
        physicsMs: 0,
        renderMs: 0,
        physicsSteps: 0,
      };
      // PixiJS DevToolsとコンソールから状態を確認できるようにする。
      globalThis.__PIXI_DEVTOOLS__ = { app };
      globalThis.__liquidfunStats = runtimeStats;

      let mouseJoint = null;
      const dragTarget = new Box2D.b2Vec2();
      setupDrag();

      let screenWidth = app.screen.width;
      let screenHeight = app.screen.height;
      let lastFrameTime = performance.now();
      let accumulatedTime = 0;
      let frameCount = 0;
      updateStats();
      requestAnimationFrame(update);

      function createWalls() {
        // fixtureを個別に触らずBodyごと交換すると、リサイズ処理が単純になる。
        for (const body of wallBodies) world.DestroyBody(body);

        const { width, height } = app.screen;
        const walls = [
          [width / 2, 5, width / 2, height + 5],
          [5, height / 2, -5, height / 2],
          [5, height / 2, width + 5, height / 2],
        ];

        wallBodies = walls.map(([halfWidth, halfHeight, x, y]) => {
          const shape = new Box2D.b2PolygonShape();
          shape.SetAsBox(
            toMeters(halfWidth),
            toMeters(halfHeight),
            new Box2D.b2Vec2(toMeters(x), toMeters(y)),
            0,
          );
          const body = world.CreateBody(new Box2D.b2BodyDef());
          body.CreateFixture(shape, 0);
          return body;
        });
      }

      function createParticles() {
        // 画面上方に粒子の塊を作り、重力で落として水たまりにする。
        const definition = new Box2D.b2ParticleSystemDef();
        definition.radius = toMeters(SIZE_PARTICLE);
        definition.pressureStrength = 4;
        definition.strictContactCheck = true;

        const system = world.CreateParticleSystem(definition);
        const shape = new Box2D.b2PolygonShape();
        shape.SetAsBox(
          toMeters(PARTICLE_HALF_WIDTH),
          toMeters(PARTICLE_HALF_HEIGHT),
          new Box2D.b2Vec2(
            toMeters(app.screen.width / 2),
            toMeters(-app.screen.height / 2),
          ),
          0,
        );

        const group = new Box2D.b2ParticleGroupDef();
        group.shape = shape;
        system.CreateParticleGroup(group);
        return system;
      }

      function createBall() {
        // 操作用の球も画面上方から落とし、粒子と自然に衝突させる。
        const definition = new Box2D.b2BodyDef();
        definition.type = Box2D.b2_dynamicBody;
        definition.position.Set(
          toMeters(app.screen.width / 2),
          toMeters(-app.screen.height * 1.5),
        );

        const shape = new Box2D.b2CircleShape();
        shape.m_radius = toMeters(SIZE_DRAGGABLE);

        const body = world.CreateBody(definition);
        const fixture = body.CreateFixture(shape, 8);
        fixture.SetFriction(0.1);
        fixture.SetRestitution(0.1);
        return body;
      }

      function createViews() {
        // 全粒子で小さな円テクスチャを共有し、GPU転送は座標だけに絞る。
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = SIZE_PARTICLE * 2 * dpi;
        const context = canvas.getContext("2d");
        context.beginPath();
        context.arc(
          SIZE_PARTICLE * dpi,
          SIZE_PARTICLE * dpi,
          (SIZE_PARTICLE * dpi) / 2,
          0,
          Math.PI * 2,
        );
        context.fillStyle = "white";
        context.fill();

        const container = new ParticleContainer({
          dynamicProperties: { position: true },
        });
        app.stage.addChild(container);

        const particleViews = [];
        const texture = Texture.from(canvas);
        for (let i = 0; i < particleCount; i++) {
          const particle = new Particle({
            texture,
            scaleX: 1 / dpi,
            scaleY: 1 / dpi,
            anchorX: 0.5,
            anchorY: 0.5,
          });
          container.addParticle(particle);
          particleViews.push(particle);
        }

        const ballView = new Graphics()
          .circle(0, 0, SIZE_DRAGGABLE)
          .fill(0x990000);
        ballView.eventMode = "static";
        ballView.cursor = "pointer";
        app.stage.addChild(ballView);
        return { ballView, particleViews };
      }

      function setDragTarget(event) {
        // Canvasは画面全体を覆うため、native eventのx/yもPixi座標と一致する。
        const point = event.global ?? event;
        dragTarget.Set(toMeters(point.x), toMeters(point.y));
      }

      function setupDrag() {
        ballView.on("pointerdown", (event) => {
          if (mouseJoint) return;
          setDragTarget(event);

          // 座標を直接変更せず、MouseJointで慣性を残したまま引っ張る。
          const definition = new Box2D.b2MouseJointDef();
          const mass = ballBody.GetMass();
          definition.bodyA = groundBody;
          definition.bodyB = ballBody;
          definition.target = dragTarget;
          definition.maxForce = 1000 * mass;
          definition.stiffness = 1000 * mass;
          definition.damping = 50 * mass;
          mouseJoint = Box2D.castObject(
            world.CreateJoint(definition),
            Box2D.b2MouseJoint,
          );
          ballBody.SetAwake(true);
        });

        addEventListener("pointermove", (event) => {
          if (!mouseJoint) return;
          setDragTarget(event);
          mouseJoint.SetTarget(dragTarget);
        });

        const stopDrag = () => {
          if (!mouseJoint) return;
          world.DestroyJoint(mouseJoint);
          mouseJoint = null;
        };
        addEventListener("pointerup", stopDrag);
        addEventListener("pointercancel", stopDrag);
      }

      function syncViewport() {
        // PixiJSのresizeToでCanvasが変わった後、物理壁を同じ寸法へ追従させる。
        const { width, height } = app.screen;
        if (width === screenWidth && height === screenHeight) return;
        screenWidth = width;
        screenHeight = height;
        createWalls();

        // 小さくリサイズしたときだけ、球を新しい壁の内側へ戻す。
        const position = ballBody.GetPosition();
        const radius = toMeters(SIZE_DRAGGABLE);
        const x = Math.min(
          Math.max(position.x, radius),
          toMeters(width) - radius,
        );
        const y = Math.min(position.y, toMeters(height) - radius);
        if (x !== position.x || y !== position.y) {
          ballBody.SetTransform(new Box2D.b2Vec2(x, y), ballBody.GetAngle());
        }
      }

      function syncViews() {
        // WASMメモリを直接読み、10,000個分の中間オブジェクト生成を避ける。
        const positions = Box2D.HEAPF32;
        for (let i = 0; i < particleCount; i++) {
          const offset = positionOffset + i * 2;
          particleViews[i].x = positions[offset] * METER;
          particleViews[i].y = positions[offset + 1] * METER;
        }

        const position = ballBody.GetPosition();
        ballView.position.set(position.x * METER, position.y * METER);
      }

      function updateStats() {
        statsText.textContent =
          particleCount.toLocaleString() +
          " particles | physics " +
          runtimeStats.physicsMs.toFixed(2) +
          " ms | render " +
          runtimeStats.renderMs.toFixed(2) +
          " ms";
      }

      function update(frameTime) {
        frameStats.begin();
        const frameMs = Math.max(frameTime - lastFrameTime, 0);
        lastFrameTime = frameTime;
        accumulatedTime += Math.min(frameMs / 1000, MAX_FRAME_DELTA);
        syncViewport();

        // 固定60Hzで最大5回だけ追いつき、長時間停止後の処理集中を防ぐ。
        const physicsStart = performance.now();
        let steps = 0;
        while (accumulatedTime >= TIME_STEP && steps < MAX_PHYSICS_STEPS) {
          world.Step(TIME_STEP, 1, 1, particleIterations);
          accumulatedTime -= TIME_STEP;
          steps++;
        }
        if (steps === MAX_PHYSICS_STEPS && accumulatedTime >= TIME_STEP) {
          accumulatedTime = 0;
        }

        const physicsMs = performance.now() - physicsStart;
        const renderStart = performance.now();
        syncViews();
        app.render();
        const renderMs = performance.now() - renderStart;

        // 指数移動平均なら履歴配列なしで表示の揺れを抑えられる。
        runtimeStats.physicsMs += (physicsMs - runtimeStats.physicsMs) * 0.05;
        runtimeStats.renderMs += (renderMs - runtimeStats.renderMs) * 0.05;
        runtimeStats.physicsSteps = steps;

        if (++frameCount % STATS_UPDATE_INTERVAL === 0) updateStats();
        frameStats.end();
        requestAnimationFrame(update);
      }
    </script>
  </head>
  <body>
    <code id="stats">Loading…</code>
  </body>
</html>
