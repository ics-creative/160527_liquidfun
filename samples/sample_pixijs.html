<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <title>LiquidFun-WASM PixiJS Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #statsPanel {
      position: fixed;
      top: 12px;
      left: 96px;
      z-index: 10;
      max-width: calc(100vw - 108px);
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: #ffffff;
      font: 11px/1.2 "SFMono-Regular", "Menlo", "Consolas", monospace;
      overflow: hidden;
      pointer-events: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.mjs",
      "liquidfun-wasm": "https://cdn.jsdelivr.net/npm/liquidfun-wasm@7.0.0/dist/es/entry.js"
    }
  }
  </script>
  <script type="module" src="js/sample_pixijs.js"></script>
</head>
<body>
  <div id="statsPanel"><code id="statsText">Loading stats...</code></div>
</body>
</html>
