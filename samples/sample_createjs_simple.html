<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LiquidFun CreateJS Simple Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body {
        margin: 0;
        background: black;
      }

      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>

    <script src="libs/liquidfun.js"></script>
    <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
    <script type="module">
      // LiquidFunの1mを100pxとして描画する。
      const METER = 100;
      const SIZE_PARTICLE = 20;
      const SIZE_DRAGGABLE = 50;
      const width = innerWidth;
      const height = innerHeight;

      const world = new b2World(new b2Vec2(0, 10));
      // 旧LiquidFunラッパーが内部から参照するためグローバルにも公開する。
      globalThis.world = world;
      const groundBody = createWalls();

      const particleSystem = createParticles();
      // 粒子数は変わらないため、座標バッファを再利用する。
      const particlePositions = particleSystem.GetPositionBuffer();
      const ballBody = createBall();
      const { stage, dragBall, particles } = createCreatejsObjects();
      const dragTarget = new b2Vec2();
      let mouseJoint = null;

      setupDrag();
      // ブラウザーの描画タイミングで更新する。
      createjs.Ticker.timingMode = createjs.Ticker.RAF;
      createjs.Ticker.on("tick", update);

      // 画面外へ流体が漏れないよう、下・左・右に壁を置く。
      function createWalls() {
        const body = world.CreateBody(new b2BodyDef());

        const addWall = (halfWidth, halfHeight, x, y) => {
          const shape = new b2PolygonShape();
          shape.SetAsBoxXYCenterAngle(
            halfWidth,
            halfHeight,
            new b2Vec2(x, y),
            0,
          );
          body.CreateFixtureFromShape(shape, 0);
        };

        addWall(
          width / METER / 2,
          5 / METER,
          width / METER / 2,
          height / METER + 0.05,
        );
        addWall(5 / METER, height / METER / 2, -0.05, height / METER / 2);
        addWall(
          5 / METER,
          height / METER / 2,
          width / METER + 0.05,
          height / METER / 2,
        );
        return body;
      }

      // 画面上部に粒子群を作り、重力で落とす。
      function createParticles() {
        const definition = new b2ParticleSystemDef();
        definition.radius = SIZE_PARTICLE / METER;

        const system = world.CreateParticleSystem(definition);
        const shape = new b2PolygonShape();
        shape.SetAsBoxXYCenterAngle(
          256 / METER,
          256 / METER,
          new b2Vec2(width / METER / 2, -height / METER / 2),
          0,
        );

        const group = new b2ParticleGroupDef();
        group.shape = shape;
        system.CreateParticleGroup(group);
        return system;
      }

      // 粒子と衝突し、ドラッグできる動的Bodyを作る。
      function createBall() {
        const definition = new b2BodyDef();
        definition.type = b2_dynamicBody;
        definition.position.Set(width / METER / 2, -height / METER);

        const shape = new b2CircleShape();
        shape.radius = SIZE_DRAGGABLE / METER;

        const body = world.CreateBody(definition);
        body.CreateFixtureFromShape(shape, 8);
        return body;
      }

      // LiquidFunのBodyに対応するCreateJSオブジェクトを作る。
      function createCreatejsObjects() {
        const canvas = document.querySelector("canvas");
        canvas.width = width;
        canvas.height = height;

        const stage = new createjs.Stage(canvas);
        createjs.Touch.enable(stage);

        // 同じ円の描画データを全粒子で共有する。
        const particleGraphics = new createjs.Graphics()
          .beginFill("white")
          .drawCircle(0, 0, SIZE_PARTICLE);
        const particles = [];
        const count = particlePositions.length / 2;
        for (let i = 0; i < count; i++) {
          const particle = new createjs.Shape(particleGraphics);
          particle.mouseEnabled = false;
          stage.addChild(particle);
          particles.push(particle);
        }

        const dragBall = new createjs.Shape();
        dragBall.graphics
          .beginFill("black")
          .setStrokeStyle(3)
          .beginStroke("white")
          .drawCircle(0, 0, SIZE_DRAGGABLE);
        stage.addChild(dragBall);

        return { stage, dragBall, particles };
      }

      function getDragTarget() {
        dragTarget.Set(stage.mouseX / METER, stage.mouseY / METER);
        return dragTarget;
      }

      // MouseJointでボールをポインターへ引き寄せる。
      function setupDrag() {
        dragBall.on("mousedown", () => {
          if (mouseJoint) return;

          const definition = new b2MouseJointDef();
          definition.bodyA = groundBody;
          definition.bodyB = ballBody;
          definition.target = getDragTarget();
          definition.maxForce = 1000 * ballBody.GetMass();

          mouseJoint = world.CreateJoint(definition);
          ballBody.SetAwake(true);
        });

        dragBall.on("pressmove", () => {
          mouseJoint?.SetTarget(getDragTarget());
        });

        dragBall.on("pressup", () => {
          if (!mouseJoint) return;
          world.DestroyJoint(mouseJoint);
          mouseJoint = null;
        });
      }

      function update(event) {
        // 前回からの経過時間で物理演算を進める。
        world.Step(event.delta / 1000, 1, 1);

        // LiquidFunの座標をCreateJSへ同期する。
        for (let i = 0; i < particles.length; i++) {
          particles[i].x = particlePositions[i * 2] * METER;
          particles[i].y = particlePositions[i * 2 + 1] * METER;
        }

        const ballPosition = ballBody.GetPosition();
        dragBall.x = ballPosition.x * METER;
        dragBall.y = ballPosition.y * METER;
        stage.update();
      }
    </script>
  </body>
</html>
